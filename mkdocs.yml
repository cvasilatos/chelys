site_name: chelys
site_description: Your shell, carried to every machine — one command for the same zsh setup on macOS and Linux.
site_url: https://cvasilatos.github.io/chelys/
repo_url: https://github.com/cvasilatos/chelys
repo_name: cvasilatos/chelys
edit_uri: edit/main/docs/

theme:
  name: material
  icon:
    logo: material/turtle
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: teal
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: teal
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.tabs.link
    - content.action.edit
    - search.highlight

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - What you get: features.md
  - Customizing: customizing.md
  - Keeping machines in sync: syncing.md
  - How it works: how-it-works.md
  - Troubleshooting: troubleshooting.md
  - Uninstall: uninstall.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: { permalink: true }
  - pymdownx.details
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tabbed: { alternate_style: true }
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/cvasilatos/chelys
