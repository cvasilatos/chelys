# Use zsh wherever it lives (/usr/bin/zsh on Linux, /bin/zsh on macOS)
run-shell 'tmux set -g default-shell "$(command -v zsh)"'

# Ensure full color and environment support inside tmux
set -g default-terminal "screen-256color"

set -g mouse on

bind -n C-k send-keys -R \; send-keys C-l \; clear-history
